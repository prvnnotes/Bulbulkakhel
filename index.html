<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="theme-color" content="#fff8ed">
  <meta name="description" content="बुलबुले का खेल — मम्मी के लिए बनाया गया खेल">

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">

  <title>बुलबुले का खेल</title>
</head>

<body>

<div class="app">

  <header class="topbar">

    <div>
      <div class="title">🫧 बुलबुले का खेल</div>
      <div class="subtitle">मम्मी के लिए प्यार से बनाया गया ❤️</div>
    </div>

    <button id="settingsBtn" class="round-btn">⚙️</button>

  </header>


  <div class="stats">

    <div class="stat">
      <small>स्तर</small>
      <strong id="levelText">1</strong>
    </div>

    <div class="stat">
      <small>स्कोर</small>
      <strong id="scoreText">0</strong>
    </div>

    <div class="stat">
      <small>सबसे अच्छा</small>
      <strong id="bestText">0</strong>
    </div>

  </div>


  <section class="game-wrapper">

    <canvas id="gameCanvas" width="480" height="760"></canvas>

    <div id="message" class="message">
      निशाना लगाइए और बुलबुला छोड़िए!
    </div>

  </section>


  <section class="bottom-controls">

    <div class="next-container">

      <span>अगला</span>

      <div id="nextBubble" class="next-bubble"></div>

    </div>


    <button id="restartBtn" class="action-btn">
      ↻ फिर से
    </button>


    <button id="soundBtn" class="action-btn">
      🔊 ध्वनि
    </button>

  </section>


  <div id="settingsPanel" class="settings hidden">

    <div class="settings-box">

      <h2>⚙️ सेटिंग्स</h2>

      <button id="resetProgressBtn">
        🗑️ पूरी प्रगति रीसेट करें
      </button>

      <button id="closeSettingsBtn">
        बंद करें
      </button>

    </div>

  </div>

</div>

<script src="game.js"></script>

</body>
</html>
